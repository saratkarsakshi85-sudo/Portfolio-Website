<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Architectural portfolio | Sakshi</title>
  <meta name="description" content="Architectural portfolio, spatial work, form, and material studies by Sakshi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="back-link.css" />
  <link rel="stylesheet" href="case-study.css" />
  <style>
    :root { --cs-bg: #ffffff; --cs-ink: #141414; --cs-accent: #422af6; --cs-muted: #55524d; --cs-display: 'DM Sans', Arial, Helvetica, sans-serif; --cs-body: 'DM Sans', Arial, Helvetica, sans-serif; }

    .arch-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      align-items: center;
      gap: 64px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 128px 48px 80px;
    }

    .arch-hero .cs-gallery-head { padding: 0; }

    .arch-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .arch-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 50px;
      padding: 0 26px;
      border: 1.5px solid #141414;
      border-radius: 999px;
      color: #141414;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .arch-btn.solid { background: #141414; color: #fff; }
    .arch-btn:hover, .arch-btn:focus-visible { background: var(--cs-accent); border-color: var(--cs-accent); color: #fff; }
    .arch-btn:focus-visible { outline: 2px solid var(--cs-accent); outline-offset: 3px; }

    .arch-art {
      margin: 0;
      padding: 24px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 30px 80px rgba(20, 20, 20, 0.14);
    }

    .arch-art img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
    }

    .arch-pdf {
      border-top: 1px solid rgba(20, 20, 20, 0.08);
      background: #f6f6f4;
    }

    .arch-pdf-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
      padding: 88px 24px 32px;
    }

    .arch-pdf-head h2 {
      margin: 0;
      font-size: clamp(26px, 3vw, 34px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .arch-pdf-head p {
      margin: 8px 0 0;
      color: var(--cs-muted);
      font-size: 15px;
    }

    .arch-pdf-head a {
      color: var(--cs-ink);
      font-size: 15px;
      font-weight: 600;
      text-underline-offset: 4px;
    }

    .arch-pages {
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 96px;
    }

    .arch-page {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(20, 20, 20, 0.1);
    }

    .arch-page canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .arch-fallback {
      margin: 0;
      color: var(--cs-muted);
      font-size: 15px;
      text-align: center;
    }

    @media (max-width: 800px) {
      .arch-hero { grid-template-columns: 1fr; gap: 36px; padding: 88px 20px 56px; }
      .arch-art { padding: 14px; border-radius: 22px; }
      .arch-pdf-head { padding: 56px 16px 24px; }
      .arch-pages { gap: 16px; padding: 0 12px 64px; }
    }
  </style>
</head>
<body>
  <a class="cs-back" href="../index.html#work"><svg viewBox="0 0 16 10" aria-hidden="true"><path d="M15 5H2M6 1L2 5l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to portfolio</a>
  <main>
    <section class="arch-hero">
      <header class="cs-gallery-head">
        <p class="cs-eyebrow">Spatial practice</p>
        <h1>Architectural <span>portfolio</span></h1>
        <p>Form, light, and material, selected architectural work from my practice in shaping space.</p>
        <div class="arch-actions">
          <a class="arch-btn solid" href="#portfolio">View portfolio</a>
          <a class="arch-btn" href="assets/architecture/sakshi-architectural-portfolio.pdf" download>Download PDF</a>
        </div>
      </header>
      <figure class="arch-art">
        <img src="assets/architecture/illustration.png" alt="Architectural landscape illustration with tents, pavilion, and hillside residence" width="1018" height="1024" fetchpriority="high" />
      </figure>
    </section>

    <section class="arch-pdf" id="portfolio" aria-labelledby="portfolio-title">
      <div class="arch-pdf-head">
        <div>
          <h2 id="portfolio-title">Portfolio</h2>
          <p class="arch-count">Scroll through every page below.</p>
        </div>
        <a href="assets/architecture/sakshi-architectural-portfolio.pdf" target="_blank" rel="noopener">Open full screen</a>
      </div>
      <div class="arch-pages" data-pdf="assets/architecture/sakshi-architectural-portfolio.pdf">
        <noscript><p class="arch-fallback"><a href="assets/architecture/sakshi-architectural-portfolio.pdf">Open the portfolio PDF</a></p></noscript>
      </div>
    </section>
  </main>
  <footer class="cs-next">
    <div class="cs-wrap">
      <a class="cs-next-link" href="travello.html"><small>Next project</small><strong>Travello</strong></a>
      <a class="cs-next-all" href="../index.html#work">View all work</a>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (() => {
      const holder = document.querySelector(".arch-pages");
      const url = holder.dataset.pdf;
      const fail = () => {
        holder.innerHTML = '<p class="arch-fallback"><a href="' + url + '">Open the portfolio PDF</a></p>';
      };
      if (!window.pdfjsLib) { fail(); return; }
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      pdfjsLib.getDocument(url).promise.then(async (pdf) => {
        document.querySelector(".arch-count").textContent = pdf.numPages + " pages. Scroll through every page below.";
        const draw = async (slot) => {
          if (slot.drawn) return;
          slot.drawn = true;
          const page = await pdf.getPage(Number(slot.dataset.page));
          const base = page.getViewport({ scale: 1 });
          const ratio = Math.min(window.devicePixelRatio || 1, 2);
          const viewport = page.getViewport({ scale: (slot.clientWidth * ratio) / base.width });
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(viewport.width);
          canvas.height = Math.round(viewport.height);
          await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
          slot.appendChild(canvas);
        };
        const watcher = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            watcher.unobserve(entry.target);
            draw(entry.target);
          });
        }, { rootMargin: "800px 0px" });

        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          const base = page.getViewport({ scale: 1 });
          const slot = document.createElement("div");
          slot.className = "arch-page";
          slot.dataset.page = n;
          slot.style.aspectRatio = base.width + " / " + base.height;
          slot.setAttribute("role", "img");
          slot.setAttribute("aria-label", "Architectural portfolio, page " + n + " of " + pdf.numPages);
          holder.appendChild(slot);
          watcher.observe(slot);
        }
      }).catch(fail);
    })();
  </script>
</body>
</html>
